<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionario sul Volontariato</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container{
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align: center;
            color: #333;
        }

        .question{
            margin-bottom: 20px;
        }

        label{
            font-weight: bold;
        }

        textarea{
            width: 100%;
            height: 80px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .options{
            margin-top: 10px;
        }

        button{
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Questionario sul Volontariato</h1>

    <!-- Domanda 1 -->
    <div class="question">
        <label>1. Conosci qualche associazione di volontariato?</label>
        <div class="options">
            <input type="radio" name="q1"> Sì
            <input type="radio" name="q1"> No
        </div>
    </div>

    <!-- Domanda 2 -->
    <div class="question">
        <label>2. Conosci qualcuno che lavora nel mondo del volontariato?</label>
        <div class="options">
            <input type="radio" name="q2"> Sì
            <input type="radio" name="q2"> No
        </div>
    </div>

    <!-- Domanda 3 - Aperta -->
    <div class="question">
        <label>3. Quante associazioni conosci?</label>
        <textarea placeholder="Scrivi la tua risposta..."></textarea>
    </div>

    <!-- Domanda 4 -->
    <div class="question">
        <label>4. Hai mai avuto a che fare con una associazione di volontariato?</label>
        <div class="options">
            <input type="radio" name="q4"> Sì
            <input type="radio" name="q4"> No
        </div>
    </div>

    <!-- Domanda 5 -->
    <div class="question">
        <label>5. Pensi sia importante la loro funzione nella società?</label>
        <div class="options">
            <input type="radio" name="q5"> Sì
            <input type="radio" name="q5"> No
        </div>
    </div>

    <!-- Domanda 6 - Aperta -->
    <div class="question">
        <label>6. Di cosa si occupa secondo te il volontariato?</label>
        <textarea placeholder="Scrivi la tua risposta..."></textarea>
    </div>

    <!-- Domanda 7 - Aperta -->
    <div class="question">
        <label>7. Quanti volontariati ci sono in Italia secondo te?</label>
        <textarea placeholder="Scrivi la tua risposta..."></textarea>
    </div>

    <!-- Domanda 8 -->
    <div class="question">
        <label>8. I volontari sono presenti anche in altre parti del mondo?</label>
        <div class="options">
            <input type="radio" name="q8"> Sì
            <input type="radio" name="q8"> No
        </div>
    </div>

    <!-- Domanda 9 -->
    <div class="question">
        <label>9. Come sei venuto a conoscenza del volontariato?</label>
        <div class="options">
            <input type="radio" name="q9"> Sì
            <input type="radio" name="q9"> No
        </div>
    </div>

    <!-- Domanda 10 -->
    <div class="question">
        <label>10. Conosci qualche associazione di volontariato?</label>
        <div class="options">
            <input type="radio" name="q10"> Sì
            <input type="radio" name="q10"> No
        </div>
    </div>

    <button type="submit">Invia</button>

</div>

</body>
</html>
